<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FFF Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .kinobox_player { width: 100%; height: 100%; }
    #msg { color: #888; font-family: sans-serif; font-size: 18px; }
  </style>
</head>
<body>
  <div class="kinobox_player" id="player"></div>
  <div id="msg">Загрузка...</div>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (id) {
      document.getElementById('msg').remove();
      document.getElementById('player').dataset.kinopoisk = id;
    } else {
      document.getElementById('msg').textContent = 'ID фильма не указан';
    }
  </script>
  <script async src="https://kinobox.tv/kinobox.min.js"></script>
</body>
</html>
